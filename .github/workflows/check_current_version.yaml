---
name: R-CMD-check standard
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      use_local_setup_action:
        description: Use composite .github/actions/setup/action.yaml to setup package specific needs
        required: false
        type: boolean
        default: false
      error-on:
        description: 'What type of result should cause a build error?'
        required: false
        type: string
        default: '"warning"'
      generate_token:
        description: Generate token from GitHub app
        required: false
        type: boolean
        default: false
    secrets:
      TOKEN_APP_ID:
        description: ID of the GitHub app used to generate a new token
        required: false
      TOKEN_APP_PRIVATE_KEY:
        description: Private Key for the GitHub app used to generate a new token
        required: false
permissions: {}
jobs:
  R-CMD-check:
    runs-on: '${{ matrix.config.os }}'
    name: '${{ matrix.config.os }} (${{ matrix.config.r }})'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-latest
            r: release
          - os: windows-latest
            r: release
          - os: ubuntu-latest
            r: devel
            http-user-agent: release
          - os: ubuntu-latest
            r: release
          - os: ubuntu-latest
            r: oldrel-1
    env:
      R_KEEP_PKG_SOURCE: true
      ERROR_ON_DEFAULT: '"warning"'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Generate custom token
        id: generate-token
        if:  ${{ inputs.generate_token }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.TOKEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Package specific setup
        if:  ${{ inputs.use_local_setup_action }}
        uses: ./.github/actions/setup
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: '${{matrix.config.r}}'
          http-user-agent: '${{matrix.config.http-user-agent}}'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        env:
          GITHUB_PAT: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          extra-packages: any::rcmdcheck, local::. 
          needs: check
      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          upload-snapshots: true
          error-on: '${{ inputs.error-on || env.ERROR_ON_DEFAULT }}'
