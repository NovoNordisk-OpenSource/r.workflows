---
name: R-CMD-check standard
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      use_local_setup_action:
        description: Use composite .github/actions/setup/action.yaml to setup package specific needs
        required: false
        type: boolean
        default: false
      error-on:
        description: 'What type of result should cause a build error?'
        required: false
        type: string
        default: '"warning"'
      generate_token:
        description: Generate token from GitHub app
        required: false
        type: boolean
        default: false
      token_repositories:
        description: Comma- or newline-separated list of repos the app token grants access to
        required: false
        type: string
        default: ${{ github.event.repository.name }}
    secrets:
      TOKEN_APP_ID:
        description: ID of the GitHub app used to generate a new token
        required: false
      TOKEN_APP_PRIVATE_KEY:
        description: Private Key for the GitHub app used to generate a new token
        required: false
permissions: {}
jobs:
  R-CMD-check:
    runs-on: '${{ matrix.config.os }}'
    name: '${{ matrix.config.os }} (${{ matrix.config.r }})'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-latest
            r: release
          - os: windows-latest
            r: release
          - os: ubuntu-latest
            r: devel
            http-user-agent: release
          - os: ubuntu-latest
            r: release
          - os: ubuntu-latest
            r: oldrel-1
    env:
      R_KEEP_PKG_SOURCE: true
      ERROR_ON_DEFAULT: '"warning"'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate custom token
        id: generate-token
        if:  ${{ inputs.generate_token }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.TOKEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.token_repositories }}
          permission-contents: read
      - name: Package specific setup
        if:  ${{ inputs.use_local_setup_action }}
        uses: ./.github/actions/setup
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: '${{matrix.config.r}}'
          http-user-agent: '${{matrix.config.http-user-agent}}'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        env:
          GITHUB_PAT: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          extra-packages: any::rcmdcheck, local::. 
          needs: check
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        env:
          GITHUB_PAT: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          upload-snapshots: true
          error-on: '${{ inputs.error-on || env.ERROR_ON_DEFAULT }}'
