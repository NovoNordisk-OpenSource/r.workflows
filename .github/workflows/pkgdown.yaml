---
name: pkgdown
"on":
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  release:
    types:
      - published
  workflow_dispatch:
  workflow_call:
    inputs:
      use_local_setup_action:
        description: Use composite .github/actions/setup/action.yaml to setup package specific needs
        required: false
        type: boolean
        default: false
      generate_token:
        description: Generate token from GitHub app
        required: false
        type: boolean
        default: false
      token_repositories:
        description: Comma- or newline-separated list of repos the app token grants access to
        required: false
        type: string
        default: ${{ github.event.repository.name }}
    secrets:
      TOKEN_APP_ID:
        description: ID of the GitHub app used to generate a new token
        required: false
      TOKEN_APP_PRIVATE_KEY:
        description: Private Key for the GitHub app used to generate a new token
        required: false
permissions: {}
jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: "pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate custom token
        id: generate-token
        if: ${{ inputs.generate_token }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.TOKEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.token_repositories }}
          permission-contents: read
      - name: Package specific setup
        if: ${{ inputs.use_local_setup_action }}
        uses: ./.github/actions/setup
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        env:
          GITHUB_PAT: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          extra-packages: "any::pkgdown, local::."
          needs: website
      - name: Build site
        run: "pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)"
        shell: "Rscript {0}"
      - name: "Deploy to GitHub pages \U0001F680"
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
      - name: Add pkgdown PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          recreate: true
          header: pkgdown
          message: >
            # Github pages

            Review the pkgdown webpage for the PR [here](https://${{
            github.repository_owner }}.github.io/${{
            github.event.repository.name }}/dev/${{
            github.event.pull_request.number }})
      - name: Copy page to temp folder
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p /home/runner/work/dev
          cp -r ./docs/* /home/runner/work/dev
      - name: Check out gh-pages branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          persist-credentials: false
      - name: Copy and push to gh-pages
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          mkdir -p dev/${{ github.event.pull_request.number }}
          cp -r /home/runner/work/dev/* ./dev/${{ github.event.pull_request.number }}
          git config --global user.email "actions-robot@novonordisk.com"
          git config --global user.name "Actions Robot From Github Actions"
          git add .
          git commit -m "Update gh pages from the PR"
          git push
      - name: Restore original checkout for cleanup
        if: always() && inputs.use_local_setup_action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
