---
name: test-coverage
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      use_codecov:
        description: Upload code coverage results to codecov.io
        required: false
        type: boolean
        default: false
      use_local_setup_action:
        description: Use composite .github/actions/setup/action.yaml to setup package specific needs
        required: false
        type: boolean
        default: false
      generate_token:
        description: Generate token from GitHub app
        required: false
        type: boolean
        default: false
      token_repositories:
        description: Comma- or newline-separated list of repos the app token grants access to
        required: false
        type: string
        default: ${{ github.event.repository.name }}
    secrets:
      TOKEN_APP_ID:
        description: ID of the GitHub app used to generate a new token
        required: false
      TOKEN_APP_PRIVATE_KEY:
        description: Private Key for the GitHub app used to generate a new token
        required: false
      CODECOV_TOKEN:
        description: Codecov upload token
        required: false
permissions: {}
jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate custom token
        id: generate-token
        if: ${{ inputs.generate_token }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.TOKEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.token_repositories }}
          permission-contents: read
      - name: Package specific setup
        if: ${{ inputs.use_local_setup_action }}
        uses: ./.github/actions/setup
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        env:
          GITHUB_PAT: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          extra-packages: |
            any::covr
            any::xml2
            any::dplyr
            any::knitr
          needs: coverage
      - name: Test coverage
        env:
          GITHUB_PAT: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          covr::package_coverage() |>
            covr::to_cobertura(filename = "cobertura.xml")

          xml <- xml2::read_xml("cobertura.xml")

          pkg_cov <- xml |>
            xml2::xml_find_first("packages/package") |>
            xml2::xml_attrs() |>
            dplyr::bind_rows()

          fnc_cov <- xml |>
            xml2::xml_find_first("packages/package") |>
            xml2::xml_find_all("classes/class") |>
            xml2::xml_attrs() |>
            lapply(dplyr::bind_rows)

          res <- list(pkg_cov, fnc_cov) |>
            dplyr::bind_rows() |>
            dplyr::transmute(
              Name = dplyr::coalesce(filename, name),
              `Coverage (%)` = round(as.numeric(`line-rate`)*100, digits = 2)
            ) |>
            knitr::kable()

          c("# Code coverage", res) |>
            writeLines(con = "coverage.md")
        shell: "Rscript {0}"
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          recreate: true
          header: coverage
          path: coverage.md
      - name: Upload coverage reports to Codecov
        if: ${{ inputs.use_codecov }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          fail_ci_if_error: true
          files: "./cobertura.xml"
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          verbose: true
