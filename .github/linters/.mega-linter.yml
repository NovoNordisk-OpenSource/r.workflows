DISABLE_LINTERS:
  - REPOSITORY_CHECKOV
  - REPOSITORY_OSV_SCANNER
# actionlint v1.7.12 does not know the job.workflow_sha context property,
# which is used in megalinter.yaml to pin the linter-config checkout.
ACTION_ACTIONLINT_ARGUMENTS: '-ignore ''property "workflow_sha" is not defined'''
SPELL_LYCHEE_ARGUMENTS: "--exclude-path man/figures --exclude-path docs --exclude-path pkgdown/favicon --exclude-path .lycheeignore --exclude-path .github/linters/.lycheeignore"
SPELL_LYCHEE_FILE_EXTENSIONS:
  - ".md"
  - ".mdx"
  - ".markdown"
  - ".html"
  - ".htm"
  - ".rst"
  - ".txt"
  - ".json"
  - ".jsonc"
  - ".json5"
  - ".yaml"
  - ".yml"
  - ".qmd"
  - ".R"
  - ".r"
  - ".Rmd"
  - ".rmd"
SPELL_CSPELL_ANALYZE_FILE_NAMES: false
MARKDOWN_MARKDOWNLINT_ARGUMENTS: "--ignore tests/testthat/_snaps --ignore LICENSE.md --ignore NEWS.md --ignore README.md --ignore cran-comments.md --ignore .github/pull_request_template.md"
HTML_HTMLHINT_CLI_LINT_MODE: "project"
HTML_HTMLHINT_ARGUMENTS: "--ignore tests/testthat/*/**"
HTML_DJLINT_CLI_LINT_MODE: "project"
HTML_DJLINT_ARGUMENTS: "--exclude tests/testthat --exclude megalinter-reports ."
